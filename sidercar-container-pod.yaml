apiVersion: v1
kind: Pod
metadata:
  name: app-with-logging
spec:
  restartPolicy: Never
  volumes:
    - name: app-logs
      emptyDir: {}

  containers:
    - name: app
      image: ngnix:latest
      command: [sh -c mvc install]
      volumeMounts:
        - name: shared-data
          mountPath: /app/data
          subPath: app-data

    - name: log-shipper
      image: busybox
      command: [sh -c 'echo "write logs']
      volumeMounts:
        - name: shared-data
          mountPath: /var/log/app
          subPath: logs
          
  volumes:
    - name: shared-data
      persistentVolumeClaim:
        calimname: app-pvc
