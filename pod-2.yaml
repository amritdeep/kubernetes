apiVersion: v1
kind: ConfigM ap
metadata:
  name: node-app-pod
  labels:
    app: node-app
spec:
  containers:
    -name: app
     image: node:18
      envFrom:
        - configMapRef:
          name: node-env-config
      env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
       - name: POD_IP
         valueFrom:
          fieldRef:
            fieldPath: status.podIP
