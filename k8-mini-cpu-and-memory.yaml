apiVersion: v1
kind: Pod
metadata:
  name: app-with-resources:
  labels:
    app: resource-demo
spec:
  containers:
    - name: app
      image: node:18
      resources:
        request:
          cpu: "250m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"
      ports:
        - containerPort: 3000