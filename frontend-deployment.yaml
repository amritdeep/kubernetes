apiVersion: app/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ngnix:latest
          env:
            - name: BACKEND_URL
              value: "http://backend-service:80"
          ports:
            - containerPort: 80