apiVersion: v1
kind: CronJob
metadata:
  name: db-cleanup
  namespace: staging
spec:
  schedule: "0 2 * * *" # every night at 2 PM
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: cleanup
              image: myapp-db-cleaner:latest
                args: ["cleanup", "--staging"]
          restartPolicy: OnFailure